[project]
name = "nanograd"
version = "0.1.0"
description = "Reverse-mode autodiff engine in NumPy, gradient-checked against finite differences."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9", "scikit-learn>=1.5"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanograd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
