[project]
name = "nnprim"
version = "0.1.0"
description = "Numerically stable transformer primitives with hand-derived backward passes."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=2.1", "scipy>=1.14"]  # scipy only for the exact erf-based GELU

[project.optional-dependencies]
experiments = ["matplotlib>=3.9"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnprim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
