[project]
name = "nanoformer"
version = "0.1.0"
description = "Transformer, MoE and selective-SSM blocks from raw tensor ops, with a NumPy reference."
requires-python = ">=3.12"
license = { text = "MIT" }
# NumPy only: the reference implementations and most of the test suite run without
# torch, which is what keeps CI CPU-only and fast.
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
torch = ["torch>=2.5"]
experiments = ["matplotlib>=3.9"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoformer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
