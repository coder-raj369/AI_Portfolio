[project]
name = "codebase-copilot"
version = "0.1.0"
description = "Hybrid retrieval + reranking demo for codebase search and repo copilots."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codecopilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
