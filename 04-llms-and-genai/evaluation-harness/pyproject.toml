[project]
name = "evalharness"
version = "0.1.0"
description = "Lightweight LLM evaluation harness: task registry, pass@k, verifier scoring, LLM-judge, regression gating."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
